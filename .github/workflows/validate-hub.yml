name: Validate DNS Hub

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'registry-view.mjs'
      - 'tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/validate-hub.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'registry-view.mjs'
      - 'tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/validate-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract module script
        shell: python
        run: |
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("Missing module script")
          Path("/tmp/hub.mjs").write_text(match.group(1))

      - name: Test version evidence, freshness and failed deployments
        run: node --test tests/registry-view.test.mjs

      - name: Validate JavaScript syntax
        run: node --check /tmp/hub.mjs

      - name: Install isolated browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser fixtures (no production connections)
        run: npx playwright test

      - name: Validate Hub contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "toolRegistryPublic" index.html
          grep -q "DNS_DESIGN_SYSTEM" index.html
          grep -q "data-dns-tool-header" index.html
          grep -q "data-dns-tool-footer" index.html
          grep -q "updateRequired" index.html
          grep -q "dependencies" index.html
          grep -q "connectivity" index.html
          echo "DNS Hub system-map contracts present."
